name: Build Windows App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.38.5'
        channel: 'stable'

    - name: Enable Windows desktop
      run: flutter config --enable-windows-desktop

    - name: Install dependencies
      working-directory: flutter_app
      run: flutter pub get

    - name: Build Windows app
      working-directory: flutter_app
      run: flutter build windows --release

    - name: Inspect build output
      working-directory: flutter_app
      run: |
        Write-Host 'Listing flutter_app/build/windows:'
        Get-ChildItem -Path build\windows -Recurse | Select-Object -First 50

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: pdf-merger-windows
        path: flutter_app/build/windows/runner/Release