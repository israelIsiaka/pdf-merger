name: Build Windows App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.38.5'
        channel: 'stable'

    - name: Enable Windows desktop
      run: flutter config --enable-windows-desktop

    - name: Install dependencies
      working-directory: flutter_app
      run: flutter pub get

    - name: Build Windows app
      working-directory: flutter_app
      run: flutter build windows --release

    - name: Debug build output structure
      working-directory: flutter_app
      run: |
        Write-Host "Checking build directory structure..."
        if (Test-Path "build/windows") {
          Get-ChildItem -Path "build/windows" -Recurse -Force | Select-Object -First 100 | Format-Table FullName
        } else {
          Write-Host "build/windows directory not found!"
        }
        
        Write-Host "`nLooking for executable..."
        Get-ChildItem -Path "build" -Filter "*.exe" -Recurse

    - name: Verify release artifacts exist
      working-directory: flutter_app
      run: |
        $releasePath = "build/windows/runner/Release"
        if (Test-Path $releasePath) {
          Write-Host "Release folder found at: $releasePath"
          Get-ChildItem -Path $releasePath -Force
        } else {
          Write-Host "WARNING: Release folder not found at $releasePath"
          Write-Host "Searching for any Release folders..."
          Get-ChildItem -Path "build" -Filter "Release" -Recurse -Directory
          
          Write-Host "`nSearching for any exe files..."
          Get-ChildItem -Path "build" -Filter "*.exe" -Recurse
          
          Write-Host "`nListing entire build directory..."
          Get-ChildItem -Path "build" -Recurse -Directory | Select-Object -First 20
        }

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: pdf-merger-windows
        path: |
          flutter_app/build/windows/**/*.exe
          flutter_app/build/windows/**/*.dll
          flutter_app/build/windows/**/data/
        if-no-files-found: error