name: Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:   # allow manual runs from the GitHub UI

# Opt into Node.js 24 for all GitHub-provided actions to silence the
# Node.js 20 deprecation warnings introduced in early 2025.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # ── Security audit (runs on every push, not just tags) ───────────────────
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install audit tools
        run: python -m pip install bandit pip-audit

      - name: bandit — static security analysis
        # B101: assert statements are intentional in tests; skip to reduce noise
        run: bandit -r src/ -ll -ii --skip B101

      - name: pip-audit — known CVE scan
        run: pip-audit -r requirements.txt

  # ── macOS → produces PDF-Merger.dmg  (PyInstaller) ───────────────────────
  # Nuitka blocks PyQt6 on macOS; PyInstaller produces a fully standalone DMG.
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Convert PNG icon to ICNS
        run: python convert_icon.py

      - name: Build DMG (PyInstaller)
        run: python build.py macos

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: PDF-Merger-macOS
          path: dist/PDF-Merger.dmg
          retention-days: 5

  # ── Linux → produces PDF-Merger-Linux.tar.gz  (Nuitka) ───────────────────
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-xinerama0 libxcb-xkb1 libxkbcommon-x11-0 \
            libglib2.0-0 libegl1 libgl1 libdbus-1-3 \
            libfontconfig1 libfreetype6 \
            patchelf

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt nuitka ordered-set zstandard

      - name: Build Linux binary (Nuitka)
        run: python build.py linux

      - name: Package as tarball
        run: tar -czf dist/PDF-Merger-Linux.tar.gz -C dist/linux-nuitka pdf-merger

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: PDF-Merger-Linux
          path: dist/PDF-Merger-Linux.tar.gz
          retention-days: 5

  # ── Windows → produces PDF Merger.exe  (PyInstaller) ─────────────────────
  # Nuitka exhausts heap space compiling pymupdf on GitHub Actions runners.
  # PyInstaller produces a working standalone EXE without that constraint.
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Generate ICO from PNG
        run: |
          python -c "
          from PIL import Image
          import os
          if os.path.exists('Logo.png') and not os.path.exists('Logo.ico'):
              img = Image.open('Logo.png')
              img.save('Logo.ico', format='ICO',
                       sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])
              print('Logo.ico generated')
          "

      - name: Build EXE (PyInstaller)
        run: python build.py windows --pyinstaller

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: PDF-Merger-Windows
          path: "dist/windows/PDF Merger.exe"
          retention-days: 5
