name: Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:   # allow manual runs from the GitHub UI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true   # silence Node.js 20 deprecation warnings

jobs:
  # ── macOS → produces PDF-Merger.dmg ────────────────────────────────────────
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pypdf Pillow py2app

      - name: Convert icon
        run: python convert_icon.py

      - name: Build DMG
        run: python build.py macos

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: PDF-Merger-macOS
          path: dist/PDF-Merger.dmg

  # ── Windows → produces PDF Merger.exe ──────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pypdf Pillow pyinstaller

      - name: Build EXE
        run: python build.py windows

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: PDF-Merger-Windows
          path: "dist/windows/PDF Merger/"
