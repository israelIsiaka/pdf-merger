name: Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:   # allow manual runs from the GitHub UI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # ── Security audit ────────────────────────────────────────────────────────
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install audit tools
        run: python -m pip install bandit pip-audit

      - name: bandit — static security analysis
        run: bandit -r src/ -ll -ii --skip B101

      - name: pip-audit — known CVE scan
        run: pip-audit -r requirements.txt

  # ── macOS → PDF-Merger.dmg ────────────────────────────────────────────────
  # PyInstaller --onedir → .app bundle → ad-hoc codesigned → DMG with
  # drag-to-Applications UI. User opens DMG and drags app to Applications.
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Convert PNG icon to ICNS
        run: python convert_icon.py

      - name: Build DMG (PyInstaller)
        run: python build.py macos

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: PDF-Merger-macOS
          path: dist/PDF-Merger.dmg
          retention-days: 5

  # ── Linux → PDF-Merger.deb ────────────────────────────────────────────────
  # PyInstaller --onefile binary packaged as a .deb so users can install
  # with one command on any Debian-based distro (Kali, Ubuntu, Debian).
  #   Install:   sudo dpkg -i PDF-Merger.deb
  #   Uninstall: sudo dpkg -r pdf-merger
  # App appears in the applications menu after install.
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-xinerama0 libxcb-xkb1 libxkbcommon-x11-0 \
            libglib2.0-0 libegl1 libgl1 libdbus-1-3 \
            libfontconfig1 libfreetype6

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Build .deb package (PyInstaller)
        run: python build.py linux --pyinstaller

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: PDF-Merger-Linux
          path: dist/PDF-Merger.deb
          retention-days: 5

  # ── Windows → PDF-Merger-Installer.exe ───────────────────────────────────
  # PyInstaller --onedir + NSIS installer that puts the app in
  # C:\Program Files\PDF Merger\ — a trusted location that Windows
  # DLL loading accepts. Running from %TEMP% (--onefile) caused
  # python3xx.dll "Invalid access to memory location" errors.
  #   Install: run PDF-Merger-Installer.exe as normal user
  #   Uninstall: Add/Remove Programs → PDF Merger
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install NSIS
        run: |
          choco install nsis --yes --no-progress
          echo "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Generate ICO from PNG
        run: |
          python -c "
          from PIL import Image
          import os
          if os.path.exists('Logo.png') and not os.path.exists('Logo.ico'):
              img = Image.open('Logo.png')
              img.save('Logo.ico', format='ICO',
                       sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])
              print('Logo.ico generated')
          "

      - name: Build app + installer (PyInstaller + NSIS)
        run: python build.py windows-installer --pyinstaller

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: PDF-Merger-Windows
          path: dist/PDF-Merger-Installer.exe
          retention-days: 5
