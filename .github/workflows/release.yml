name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: 'stable'
      - run: flutter config --enable-windows-desktop
      - working-directory: flutter_app
        run: flutter pub get
      - working-directory: flutter_app
        run: flutter build windows --release
      - name: Zip Release folder
        working-directory: flutter_app
        run: |
          $release = Get-ChildItem -Path build/windows -Recurse -Directory -Filter Release | Select-Object -First 1
          Compress-Archive -Path "$($release.FullName)/*" -DestinationPath "pdf-merger-windows.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: pdf-merger-windows
          path: flutter_app/pdf-merger-windows.zip

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: 'stable'
      - run: flutter config --enable-macos-desktop
      - working-directory: flutter_app
        run: flutter pub get
      - working-directory: flutter_app
        run: flutter build macos --release
      - name: Zip .app bundle
        working-directory: flutter_app
        run: |
          cd build/macos/Build/Products/Release
          ditto -c -k --sequesterRsrc --keepParent pdf_merger.app "$GITHUB_WORKSPACE/flutter_app/pdf-merger-macos.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: pdf-merger-macos
          path: flutter_app/pdf-merger-macos.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: 'stable'
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev
      - run: flutter config --enable-linux-desktop
      - working-directory: flutter_app
        run: flutter pub get
      - working-directory: flutter_app
        run: flutter build linux --release
      - name: Tar bundle
        working-directory: flutter_app
        run: |
          bundle=$(find build/linux -type d -name bundle | head -n1)
          tar czf pdf-merger-linux.tar.gz -C "$bundle" .
      - uses: actions/upload-artifact@v4
        with:
          name: pdf-merger-linux
          path: flutter_app/pdf-merger-linux.tar.gz

  release:
    needs: [ build-windows, build-macos, build-linux ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
