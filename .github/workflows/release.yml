name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: 'stable'
      - run: flutter config --enable-windows-desktop
      - working-directory: flutter_app
        run: flutter pub get
      - working-directory: flutter_app
        run: flutter build windows --release
      - name: Bundle LibreOffice
        working-directory: flutter_app
        run: |
          $ErrorActionPreference = "Stop"
          $listing = (Invoke-WebRequest -Uri "https://download.documentfoundation.org/libreoffice/stable/" -UseBasicParsing).Content
          $LO_VERSION = [regex]::Matches($listing, '(\d+\.\d+\.\d+)/"') |
            ForEach-Object { $_.Groups[1].Value } | Sort-Object { [version]$_ } | Select-Object -Last 1
          Write-Host "Bundling LibreOffice $LO_VERSION"
          $msiUrl = "https://download.documentfoundation.org/libreoffice/stable/$LO_VERSION/win/x86_64/LibreOffice_${LO_VERSION}_Win_x86-64.msi"
          Invoke-WebRequest -Uri $msiUrl -OutFile "$env:RUNNER_TEMP\libreoffice.msi"
          $extractDir = "$env:RUNNER_TEMP\lo-extract"
          Start-Process msiexec.exe -ArgumentList "/a `"$env:RUNNER_TEMP\libreoffice.msi`" /qn TARGETDIR=`"$extractDir`"" -Wait -NoNewWindow
          $sofficeExe = Get-ChildItem -Path $extractDir -Recurse -Filter soffice.exe | Select-Object -First 1
          if (-not $sofficeExe) { throw "soffice.exe not found after MSI extraction" }
          $loRoot = $sofficeExe.Directory.Parent.FullName
          $release = (Get-ChildItem -Path build/windows -Recurse -Filter pdf_merger.exe | Select-Object -First 1).Directory.FullName
          Copy-Item -Path $loRoot -Destination "$release\libreoffice" -Recurse
      - name: Zip Release folder
        working-directory: flutter_app
        run: |
          $ErrorActionPreference = "Stop"
          $exe = Get-ChildItem -Path build/windows -Recurse -Filter pdf_merger.exe | Select-Object -First 1
          if (-not $exe) { throw "pdf_merger.exe not found under build/windows" }
          Compress-Archive -Path "$($exe.Directory.FullName)\*" -DestinationPath "pdf-merger-windows.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: pdf-merger-windows
          path: flutter_app/pdf-merger-windows.zip
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: 'stable'
      - run: flutter config --enable-macos-desktop
      - working-directory: flutter_app
        run: flutter pub get
      - working-directory: flutter_app
        run: flutter build macos --release
      - name: Bundle LibreOffice
        run: |
          set -e
          LO_VERSION=$(curl -sf https://download.documentfoundation.org/libreoffice/stable/ \
            | grep -oE '[0-9]+\.[0-9]+\.[0-9]+/"' | tr -d '"/' | sort -V | tail -1)
          echo "Bundling LibreOffice $LO_VERSION"
          curl -sfL --retry 3 -o /tmp/libreoffice.dmg \
            "https://download.documentfoundation.org/libreoffice/stable/${LO_VERSION}/mac/aarch64/LibreOffice_${LO_VERSION}_MacOS_aarch64.dmg"
          hdiutil attach /tmp/libreoffice.dmg -nobrowse -mountpoint /Volumes/LO
          cp -R "/Volumes/LO/LibreOffice.app" \
            "flutter_app/build/macos/Build/Products/Release/pdf_merger.app/Contents/Resources/LibreOffice.app"
          hdiutil detach /Volumes/LO
      - name: Zip .app bundle
        working-directory: flutter_app
        run: |
          cd build/macos/Build/Products/Release
          ditto -c -k --sequesterRsrc --keepParent pdf_merger.app "$GITHUB_WORKSPACE/flutter_app/pdf-merger-macos.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: pdf-merger-macos
          path: flutter_app/pdf-merger-macos.zip
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: 'stable'
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev
      - run: flutter config --enable-linux-desktop
      - working-directory: flutter_app
        run: flutter pub get
      - working-directory: flutter_app
        run: flutter build linux --release
      - name: Bundle LibreOffice
        working-directory: flutter_app
        run: |
          set -e
          LO_VERSION=$(curl -sf https://download.documentfoundation.org/libreoffice/stable/ \
            | grep -oE '[0-9]+\.[0-9]+\.[0-9]+/"' | tr -d '"/' | sort -V | tail -1)
          echo "Bundling LibreOffice $LO_VERSION"
          curl -sfL --retry 3 -o /tmp/libreoffice.tar.gz \
            "https://download.documentfoundation.org/libreoffice/stable/${LO_VERSION}/deb/x86_64/LibreOffice_${LO_VERSION}_Linux_x86-64_deb.tar.gz"
          mkdir -p /tmp/lo-extract /tmp/lo-root
          tar xzf /tmp/libreoffice.tar.gz -C /tmp/lo-extract
          for deb in /tmp/lo-extract/*/DEBS/*.deb; do
            dpkg-deb -x "$deb" /tmp/lo-root
          done
          loDir=$(find /tmp/lo-root/opt -maxdepth 1 -type d -name 'libreoffice*' | head -n1)
          if [ -z "$loDir" ]; then echo "LibreOffice dir not found after deb extraction"; exit 1; fi
          bundle=$(find build/linux -type d -name bundle | head -n1)
          cp -r "$loDir" "$bundle/libreoffice"
          chmod +x "$bundle/libreoffice/program/soffice" "$bundle/libreoffice/program/soffice.bin"
      - name: Tar bundle
        working-directory: flutter_app
        run: |
          bundle=$(find build/linux -type d -name bundle | head -n1)
          tar czf pdf-merger-linux.tar.gz -C "$bundle" .
      - uses: actions/upload-artifact@v4
        with:
          name: pdf-merger-linux
          path: flutter_app/pdf-merger-linux.tar.gz
          if-no-files-found: error

  release:
    needs: [ build-windows, build-macos, build-linux ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          body: |
            ## Downloads
            LibreOffice (needed for Word<->PDF) is bundled into every build below, nothing extra to install.
            - **macOS:** `pdf-merger-macos.zip`
            - **Windows:** `pdf-merger-windows.zip`
            - **Linux:** `pdf-merger-linux.tar.gz`

            ## First launch (one-time step)
            These builds aren't code-signed, so your OS blocks them on first run. This is expected — bypass it once:

            **macOS:** Right-click the app -> **Open** -> **Open** in the dialog.
            If nothing happens: **System Settings -> Privacy & Security**, scroll down, click **Open Anyway**, then confirm.

            **Windows:** Click **More info** on the SmartScreen popup, then **Run anyway**.

            **Linux:** `chmod +x pdf_merger` if needed, then run the extracted binary.
